name: fiurozz

services:
  project-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8086
      DATABASE_URL: ${DATABASE_URL}
      SPRING_DATA_REDIS_HOST: redis
      # Reached by service name from inside Docker; owner snapshots arrive over user.events.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}
      # Inside Docker, MinIO is reached by service name; localhost would be this container.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${PROJECT_MEDIA_BUCKET:-project-media}
      # Stored in project_media.media_url, so it must be reachable from the browser.
      S3_PUBLIC_BASE_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      S3_AUTO_CREATE_BUCKET: "true"
    ports:
      - "${PROJECT_SERVICE_PORT:-8086}:8086"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
