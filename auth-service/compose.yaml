name: fiurozz

services:
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      RABBIT_MQ_URI: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
