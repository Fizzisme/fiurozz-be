routes:

  - name: auth
    prefix: /api/auth
    upstream: ${AUTH_SERVICE}

    timeout: 5s

    retry:
      attempts: 3
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    rate_limit:
      requests: 10
      window: 1m
      burst: 5

    auth_mode: optional

  - name: user
    prefix: /api/users
    upstream: ${USER_SERVICE}

    timeout: 5s

    retry:
      attempts: 3
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    rate_limit:
      requests: 10
      window: 1m
      burst: 5

    auth_mode: optional

    # multipart/form-data only: profile avatar (5 MB) and cover (10 MB)
    # uploads. Body cap = 11 MB (11 * 1024 * 1024) to cover multipart overhead.
    upload:
      timeout: 30s
      max_body_bytes: 11534336

  - name: project
    prefix: /api/projects
    upstream: ${PROJECT_SERVICE}

    timeout: 5s

    retry:
      attempts: 3
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    rate_limit:
      requests: 45
      window: 1m
      burst: 10

    auth_mode: optional

    # multipart/form-data only: create project with up to 5 images
    # (5 MB each) and one 50 MB video. Matches project-service's
    # spring.servlet.multipart.max-request-size (80MB = 80 * 1024 * 1024).
    upload:
      timeout: 120s
      max_body_bytes: 83886080

  - name: ai
    prefix: /api/ai
    upstream: ${AI_SERVICE}

    # Applies to non-SSE requests only; SSE streams are exempt (streaming: true).
    timeout: 10s

    retry:
      attempts: 3
      base_delay: 1s
      max_delay: 3s

    breaker:
      enabled: true

    rate_limit:
      requests: 120
      window: 1m
      burst: 30

    auth_mode: required

    streaming: true
