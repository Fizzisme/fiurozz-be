spring:
  application:
    name: project-service
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 30000
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  sql:
    init:
      mode: never
  batch:
    jdbc:
      initialize-schema: never
  rabbitmq:
    # Same variable and default as user-service. Only consumes user.events.
    # Spring Boot has no spring.rabbitmq.uri property (it would be ignored and the client would
    # fall back to localhost); an amqp:// URI is accepted as an address.
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
    listener:
      simple:
        # Failed messages are retried in-process, then rejected without requeue so the
        # queue's dead-letter settings park them on the failed queue.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2.0
  servlet:
    multipart:
      # Create project: up to 5 images of 5 MB and one 50 MB video.
      max-file-size: 50MB
      max-request-size: 80MB

server:
  port: ${SERVER_PORT:8086}

storage:
  files:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    # PRIVATE source-code bucket; never reuse the public project-media bucket.
    bucket: ${FILES_S3_BUCKET:project-files}
    auto-create-bucket: ${FILES_S3_AUTO_CREATE_BUCKET:true}
    gc-enabled: ${FILES_GC_ENABLED:true}
    gc-grace-hours: ${FILES_GC_GRACE_HOURS:24}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:project-media}
    # Must be reachable from the browser; used to build stored media URLs.
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000}
    auto-create-bucket: ${S3_AUTO_CREATE_BUCKET:true}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
